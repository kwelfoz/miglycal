name: build-apk

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verificar e preparar chave de assinatura permanente
        env:
          MIGLYCAL_KEYSTORE_BASE64: ${{ secrets.MIGLYCAL_KEYSTORE_BASE64 }}
          MIGLYCAL_KEYSTORE_PASSWORD: ${{ secrets.MIGLYCAL_KEYSTORE_PASSWORD }}
          MIGLYCAL_KEY_ALIAS: ${{ secrets.MIGLYCAL_KEY_ALIAS }}
          MIGLYCAL_KEY_PASSWORD: ${{ secrets.MIGLYCAL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MIGLYCAL_KEYSTORE_BASE64" || { echo "Falta o secret MIGLYCAL_KEYSTORE_BASE64"; exit 1; }
          test -n "$MIGLYCAL_KEYSTORE_PASSWORD" || { echo "Falta o secret MIGLYCAL_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$MIGLYCAL_KEY_ALIAS" || { echo "Falta o secret MIGLYCAL_KEY_ALIAS"; exit 1; }
          test -n "$MIGLYCAL_KEY_PASSWORD" || { echo "Falta o secret MIGLYCAL_KEY_PASSWORD"; exit 1; }

          echo "$MIGLYCAL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/miglycal-release.jks"
          test -s "$RUNNER_TEMP/miglycal-release.jks"
          echo "MIGLYCAL_KEYSTORE_PATH=$RUNNER_TEMP/miglycal-release.jks" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compilar APK assinado
        env:
          MIGLYCAL_KEYSTORE_PASSWORD: ${{ secrets.MIGLYCAL_KEYSTORE_PASSWORD }}
          MIGLYCAL_KEY_ALIAS: ${{ secrets.MIGLYCAL_KEY_ALIAS }}
          MIGLYCAL_KEY_PASSWORD: ${{ secrets.MIGLYCAL_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Miglycal-apk
          path: app/build/outputs/apk/release/*.apk
